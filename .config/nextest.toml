# cargo-nextest settings (https://nexte.st/docs/configuration/).

# `capture_modes` (TRN-05, CAP-08) plays fixture audio through the real
# pipeline on `FastClock`, which runs host time faster than the wall clock.
# When the machine is overloaded (parallel agent builds), a starved pipeline
# can miss a line. Until it runs on the paced harness `live_fixture` uses
# (`tests/support/paced.rs`, PARITY_PLAN §7.2), it gets room to run and one
# retry; nextest still reports a pass on retry as FLAKY, so it stays visible.
[[profile.default.overrides]]
filter = 'binary(capture_modes)'
threads-required = 4
retries = 1
