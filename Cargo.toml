[workspace]
resolver = "2"
members = [
    "crates/deino-*",
    # Vendored third-party crates, each with its licence files.
    "crates/third_party/*",
    "frontend/src-tauri",
    "llama-helper",
]

[workspace.package]
edition = "2024"
# Kept equal to `rust-toolchain.toml`, so clippy suggests every stable API we can use.
rust-version = "1.96"
publish = false

# Versions shared by more than one crate. Members inherit them with
# `dep = { workspace = true }` and add features locally. Pin the specta set
# together: tauri-specta, specta and specta-typescript only work as a matched
# release (the set Handy and anarlog ship with).
[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
futures-util = "0.3.32"
# Self-registration (REG-01): each feature, pipeline stage and attach hook adds
# itself to a distributed slice from its own file, so no shared list grows.
# Linker sections on Mach-O, ELF and PE; MIT OR Apache-2.0.
linkme = "=0.3.37"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
specta = { version = "=2.0.0-rc.22", features = ["derive", "chrono", "uuid"] }
specta-typescript = "=0.0.9"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "macros", "migrate", "runtime-tokio", "sqlite", "uuid"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
thiserror = "2.0.16"
tokio = { version = "1.52.3", features = ["full"] }
# `CancellationToken` and `TaskTracker` (feature `rt`) for owned background work.
tokio-util = { version = "0.7.18", features = ["rt"] }
uuid = { version = "1.23.1", features = ["serde", "v4", "v7"] }
# Zip archives (EXP-01/02): the version docx-rs already uses, deflate only.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

deino-audio = { path = "crates/deino-audio" }
deino-core = { path = "crates/deino-core" }
deino-connect = { path = "crates/deino-connect" }
deino-db = { path = "crates/deino-db" }
# Tests add `features = ["test-support"]` for the fakes of its ports.
deino-detect = { path = "crates/deino-detect" }
deino-diarize = { path = "crates/deino-diarize" }
deino-doc = { path = "crates/deino-doc" }
deino-domain = { path = "crates/deino-domain" }
deino-export = { path = "crates/deino-export" }
# macOS Calendar through EventKit (ORG-01); a stub elsewhere.
deino-eventkit = { path = "crates/deino-eventkit" }
# Tests add `features = ["test-support"]` for its fakes and the scripted provider.
deino-integrations = { path = "crates/deino-integrations" }
# Tests add `features = ["test-support"]` for `MockProvider` and the fakes of its ports.
deino-llm = { path = "crates/deino-llm" }
deino-net = { path = "crates/deino-net" }
deino-pipeline = { path = "crates/deino-pipeline" }
deino-recording = { path = "crates/deino-recording" }
deino-secrets = { path = "crates/deino-secrets" }
# Speaker tags from the meeting app's window (CAP-05); tests add
# `features = ["test-support"]` for its fakes.
deino-speaker-tags = { path = "crates/deino-speaker-tags" }
deino-stt = { path = "crates/deino-stt" }
# Tests add `features = ["test-support"]` for its fakes; the app's debug-only
# `dev` plugin uses only its fixture seeder.
deino-testkit = { path = "crates/deino-testkit", default-features = false }

# PARITY_PLAN §3A limits and safety rules. Every member opts in with
# `[lints] workspace = true`; inherited modules are exempted in one place
# (`frontend/src-tauri/src/legacy_lints.rs`). Thresholds live in `clippy.toml`.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the codebase's conventions rather than catch bugs.
missing_errors_doc = "allow"         # every error type documents its variants instead
module_name_repetitions = "allow"    # `meetings::MeetingRepo` reads better than `meetings::Repo`
must_use_candidate = "allow"         # too noisy for getters; `unused_must_use` covers real cases
# §3A hard limits; thresholds in clippy.toml.
cognitive_complexity = "deny"
excessive_nesting = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
# No panicking APIs and no debugging leftovers outside tests.
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "warn"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
# Never drop a `Result` or future silently; every suppression explains itself.
allow_attributes_without_reason = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
# Architecture rules from clippy.toml (`disallowed-*`).
disallowed_methods = "deny"
disallowed_types = "deny"

# Dependencies build optimised while workspace code stays fast to compile, so
# debug builds of the audio and STT paths run at a usable speed.
[profile.dev.package."*"]
opt-level = 1
debug = false

# The local LLM sidecar is loaded on demand, so it is optimised for size.
# Cargo honours `[profile]` only in the workspace root; the member's own
# `[profile.release]` was silently ignored.
[profile.release.package.llama-helper]
codegen-units = 1
opt-level = "s"

# Release builds of the sidecar add LTO, which Cargo cannot set per package:
# `cargo build --profile sidecar -p llama-helper` (release-macos.yml).
[profile.sidecar]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "s"

# Cargo only honours [patch] in the workspace root manifest; in a member's
# Cargo.toml it is ignored with a warning.
[patch.crates-io]
# Unreleased cpal fixes used for microphone capture.
cpal = { git = "https://github.com/RustAudio/cpal", rev = "51c3b43" }
