<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2A27"/>
      <stop offset="1" stop-color="#191816"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824 px tile with 100 px margin and ~22% corner radius -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <!-- "D" monogram: a stem plus a half-round bowl, centred on the tile -->
  <path d="M368 332 H476 A180 180 0 0 1 476 692 H368 Z"
        fill="none" stroke="#F3EFE7" stroke-width="60" stroke-linejoin="round"/>
</svg>
