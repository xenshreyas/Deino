[package]
name = "deino"
version = "0.4.1"
description = "Deino: a private, local-first AI meeting notepad for macOS"
authors = ["Shreyas"]
publish.workspace = true
# The inherited code is edition 2021; the crates in crates/ use the workspace's 2024.
edition = "2021"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "deino_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


# GPU backends for transcription (transcribe-cpp, through deino-stt). Metal is
# always on for macOS; the others build only on their own platforms.
#
#   macOS:          cargo build --release                     (Metal)
#   Windows/Linux:  cargo build --release --features cuda      (NVIDIA)
#                   cargo build --release --features vulkan    (AMD/Intel)
#                   cargo build --release --features hipblas   (AMD ROCm, Linux)
#
# `coreml` and `openblas` were whisper.cpp (whisper-rs) options; whisper-rs is
# gone (it cannot link next to transcribe-cpp: two ggml copies), so they are
# kept only so existing scripts keep working, and do nothing.
[features]
default = ["platform-default"]
platform-default = []
metal = ["deino-stt/metal"]
coreml = []
cuda = ["deino-stt/cuda"]
vulkan = ["deino-stt/vulkan"]
hipblas = ["deino-stt/rocm"]
openblas = []
openmp = ["deino-stt/openmp"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }
reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }
which = "6.0.1"
zip = "2.2"           # Archive extraction for the FFmpeg and ONNX Runtime downloads
sha2 = "0.10"         # SHA-256 pins for build-time downloads


[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.17.1"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Cross-platform audio capture
cpal = "0.15.3"

# Wav encoding - now using manual WAV creation instead of hound
# hound = "3.5"

# Cli ! shouldn't be required if using as lib
clap = { version = "4.3", features = ["derive", "env"] }

# Dates
chrono = { version = "0.4.31", features = ["serde"] }

# Log
log = "0.4"
env_logger = "0.11"
tracing = "0.1.40"
which = "6.0.1"

# Bytes
bytemuck = "1.16.1"

# EBU R128 loudness normalization (professional broadcast standard)
ebur128 = "0.1"

# Noise suppression - RNNoise-based neural network noise reduction. Only the
# library: the default `bin` feature pulls in clap 3 and the unmaintained `atty`.
nnnoiseless = { version = "0.5", default-features = false }

# Async utilities
futures-util = "0.3"
silero_rs = { git = "https://github.com/emotechlab/silero-rs", rev = "26a6460", package = "silero" }

# Parakeet (ONNX-based fast transcription) dependencies
ort = { version = "2.0.0-rc.10" }  # ONNX Runtime for Parakeet models
thiserror = "2.0.16"                # Error handling for Parakeet

# Async
tokio = { version = "1.32.0", features = ["full", "tracing"] }
tokio-util = "0.7"  # Utilities for tokio including CancellationToken
async-trait = "0.1"  # Trait abstraction for async methods

reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }

# crossbeam
crossbeam = "0.8.4"
dashmap = "6.1.0"

# Directories
dirs = "5.0.1"

# Additional dependencies for notification system
url = "2.5.0"


# System monitoring for resource management
sysinfo = "0.32"

lazy_static = { version = "1.4.0" }
realfft = "3.4.0"
regex = "1.11.0"
ndarray = "0.16"
bytes = { version = "1.9.0", features = ["serde"] }

symphonia = { version = "0.5.4", features = ["aac", "isomp4", "mp3", "flac", "ogg", "vorbis", "pcm", "wav", "opt-simd"] }
rand = "0.8.5"
rayon = "1.10"
rubato = "0.15.0"
tempfile = "3.3.0"

ffmpeg-sidecar = { git = "https://github.com/nathanbabcock/ffmpeg-sidecar", branch = "main" }

sqlx = { workspace = true, features = ["json"] }

# The Tauri-free core (crates/) and typed IPC through tauri-specta (ADR 0007).
# Live recording (FND-05b, CAP-02): capture, the crash-safe tracks, and the
# two-lane Me/Them pipeline that saves the transcript as it is spoken.
deino-audio.workspace = true
# OAuth and the Google and Microsoft calendar connectors (ORG-01).
deino-connect.workspace = true
deino-core.workspace = true
deino-db.workspace = true
deino-recording.workspace = true
# Local speaker diarization behind the `diarize` stage (CAP-03).
deino-diarize.workspace = true
deino-domain.workspace = true
# Meeting renderers (EXP-01): the export plugin names their format and section types.
deino-export.workspace = true
# macOS Calendar through EventKit, the default calendar source (ORG-01).
deino-eventkit.workspace = true
deino-llm.workspace = true
# FND-12: every outbound request goes through deino-net's scoped clients.
deino-net.workspace = true
deino-pipeline.workspace = true
# The note document model (NOT-01): Markdown in and out for the summary view.
deino-doc.workspace = true
# Decodes pasted note images sent as base64 (already in the tree, MIT/Apache).
base64 = "0.22.1"
deino-secrets.workspace = true
# The fixture seeder behind the debug-only `dev` plugin (features/dev.rs); its
# fakes stay behind `test-support`, which only the dev-dependency enables.
deino-testkit.workspace = true
# Speech-to-text: transcribe-cpp in supervised worker processes (CAP-01).
deino-stt.workspace = true
# Meeting detection and the prompt's rules (CAP-06).
deino-detect.workspace = true
# `serde_json` types the settings merge patch (`plugin:settings|patch`).
specta = { workspace = true, features = ["serde_json"] }
tauri-specta.workspace = true

# Common Tauri configuration
tauri = { version = "2.6.2", features = [ "macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-fs = "2.4.0"
tauri-plugin-dialog = "2.3.0"
# Rich-text copies (HTML with a plain-text fallback) for the export plugin.
arboard = { version = "=3.6.1", default-features = false }
tauri-plugin-notification = "2.3.1"
tauri-plugin-updater = "2.3.0"
tauri-plugin-process = "2.3.0"

# Desktop-only single instance guard
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "=2.3.7"

# macOS-specific dependencies with Metal GPU acceleration
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.6.2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
once_cell = "1.17.1"
objc = "0.2.7"
tauri-plugin-log = { version = "2.6.0", features = ["colored"] }
anyhow = "1.0"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.11", features = ["multipart", "json"] }
core-graphics = "0.23"
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }
# NSWorkspace.openURL for OAuth sign-in pages (ORG-01); the objc2 release in the tree.
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }
dasp = "0.11.0"
# The meeting prompt as a non-activating NSPanel, so it never steals focus
# from the call (CAP-06; Handy's overlay pattern). MIT/Apache-2.0, pinned.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "da9c9a8d4eb7f0524a2508988df1a7d9585b4904" }

# Windows-specific dependencies
# Default: CPU-only build (no BLAS)
# Users can enable features manually:
#   --features cuda     (NVIDIA GPUs)
#   --features vulkan   (AMD/Intel GPUs)
#   --features openblas (OpenBLAS optimization, requires BLAS_INCLUDE_DIRS)
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.10", features = ["load-dynamic"] }

[dev-dependencies]
deino-audio = { workspace = true, features = ["test-support"] }
deino-core = { workspace = true, features = ["test-support"] }
deino-detect = { workspace = true, features = ["test-support"] }
deino-recording = { workspace = true, features = ["test-support"] }
deino-llm = { workspace = true, features = ["test-support"] }
# Structured-output types in the LLM smoke tests (llm/smoke_tests.rs).
schemars = "1.2.1"
deino-net = { workspace = true, features = ["test-support"] }
deino-pipeline = { workspace = true, features = ["test-support"] }
deino-secrets = { workspace = true, features = ["test-support"] }
deino-stt = { workspace = true, features = ["test-support"] }
# Test catalogs and downloads are checked against real SHA-256 digests.
sha2 = "0.10"
deino-testkit = { workspace = true, features = ["test-support"] }
specta-typescript.workspace = true
# Mock runtime for end-to-end IPC/ACL tests of feature plugins (features/ipc_tests.rs).
tauri = { version = "2.6.2", features = ["test"] }
tempfile = "3.3.0"
infer = "0.15"
criterion = { version = "0.5.1", features = ["async_tokio"] }
memory-stats = "1.0"
strsim = "0.10.0"
futures = "0.3.31"
tracing-subscriber = "0.3.16"

[lints]
workspace = true
