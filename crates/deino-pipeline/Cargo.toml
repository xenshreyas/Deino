[package]
name = "deino-pipeline"
version = "0.1.0"
description = "Deino's post-meeting pipeline: durable SQLite jobs, the stage trait, the registry and the runner"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/deino_pipeline.rs"

[features]
# Fakes for other crates' tests (`FakeSleeper`, `RecordedProgress`).
test-support = ["deino-domain/test-support"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
deino-core.workspace = true
deino-db.workspace = true
deino-domain.workspace = true
log.workspace = true
serde.workspace = true
specta.workspace = true
sqlx = { workspace = true, features = ["json"] }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
deino-core = { workspace = true, features = ["test-support"] }
deino-db = { workspace = true, features = ["test-support"] }
deino-domain = { workspace = true, features = ["test-support"] }
deino-testkit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
