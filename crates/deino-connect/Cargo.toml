[package]
name = "deino-connect"
version = "0.1.0"
description = "Deino's connections to the user's online calendar accounts: the Google Calendar and Microsoft Graph calendar sources, signed in through the integrations framework's OAuth"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/deino_connect.rs"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
deino-core.workspace = true
deino-domain.workspace = true
# The one OAuth layer (INT-00, ADR 0031): PKCE, the loopback redirect, the
# token endpoint and the browser port.
deino-integrations.workspace = true
deino-net.workspace = true
deino-secrets.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# The sign-in's cancellation token.
tokio-util.workspace = true
# The calendar APIs' URLs (already in the tree).
url = "2.5.8"

[dev-dependencies]
deino-core = { workspace = true, features = ["test-support"] }
deino-domain = { workspace = true, features = ["test-support"] }
deino-integrations = { workspace = true, features = ["test-support"] }
deino-net = { workspace = true, features = ["test-support"] }
deino-secrets = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
