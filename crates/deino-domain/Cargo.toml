[package]
name = "deino-domain"
version = "0.1.0"
description = "Deino's shared vocabulary: typed IDs, the IPC error model and the Clock port"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/deino_domain.rs"

[features]
# Fakes for other crates' tests (`FakeClock`). Never enable outside dev-dependencies.
test-support = []

[dependencies]
chrono.workspace = true
# Title patterns in conditions (AUT-01); the version deino-core already pins.
regex = "1.12.3"
serde.workspace = true
specta.workspace = true
sqlx.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
