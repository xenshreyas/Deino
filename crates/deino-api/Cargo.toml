[package]
name = "deino-api"
version = "0.1.0"
description = "The local REST API (DEV-03): an axum server on 127.0.0.1 over the app's services, behind hashed API keys"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/deino_api.rs"

[dependencies]
async-trait.workspace = true
# The HTTP server (MIT). Only what a loopback JSON API needs: no tracing,
# no forms, no HTTP/2, no client (`deino-net` owns the only one, ADR 0019).
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
# Opaque pagination cursors (MIT/Apache-2.0); already in the tree.
base64 = "0.22.1"
chrono.workspace = true
deino-core.workspace = true
deino-doc.workspace = true
deino-domain.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync"] }
tokio-util.workspace = true

[dev-dependencies]
deino-core = { workspace = true, features = ["test-support"] }
deino-db = { workspace = true, features = ["test-support"] }
deino-testkit = { workspace = true, features = ["test-support"] }
# A raw look at the trash in a test.
sqlx.workspace = true
# Runs the router in-process in tests (MIT); axum's own version.
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[lints]
workspace = true
