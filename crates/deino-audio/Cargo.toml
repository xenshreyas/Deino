[package]
name = "deino-audio"
version = "0.1.0"
description = "Deino's crash-safe audio recording: track writers, manifest, recovery, finalize and the AudioSource port"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/deino_audio.rs"

[features]
# Fakes of this crate's ports (`FakeHostClock`, `MemorySink`, `FakeEncoderFactory`,
# `FakeDiskSpace`) for other crates' tests. Never enable outside dev-dependencies.
test-support = []

[dependencies]
chrono.workspace = true
# The microphone: cross-platform input streams (same version as the app). Apache-2.0.
cpal = "=0.15.3"
deino-domain.workspace = true
log.workspace = true
# Wait-free single-producer single-consumer ring between a real-time audio
# callback and the writer thread (§3C). MIT/Apache-2.0.
rtrb = "=0.4.0"
# One allocation-free sample-rate conversion per consumer (§3C; same version
# as the app). MIT.
rubato = "=0.15.0"
serde.workspace = true
serde_json.workspace = true
# Imported files (CAP-11): every container and codec symphonia reads, demuxed
# and decoded in Rust, no FFmpeg (spike §4). MPL-2.0, as already used by the app.
symphonia = { version = "=0.5.5", default-features = false, features = ["all", "opt-simd"] }
# Opus for symphonia 0.5 through libopus, built from source (BSD-3-Clause). MIT/Apache-2.0.
symphonia-adapter-libopus = "=0.2.9"
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# F_FULLFSYNC and statvfs without hand-written unsafe FFI. MIT/Apache-2.0.
rustix = { version = "=1.1.4", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
# AVAssetWriter (CMAF segments), Core Media sample buffers, ExtAudioFile and
# mach time. Same git rev as the app crate, so both share one build.
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }
# The AVFoundation calls cidre a9587fa does not bind: AVAssetExportSession
# (passthrough export), AVMutableComposition (a screen recording given its sound) and -[AVAssetWriter finishWritingWithCompletionHandler:].
block2 = "=0.6.2"
objc2 = "=0.6.4"
# NSWorkspace sleep/wake notifications. MIT.
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVAsset", "AVAssetExportSession", "AVAssetTrack", "AVComposition", "AVCompositionTrack", "AVMediaFormat", "block2", "objc2-core-media"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "CMTime", "CMTimeRange"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSError", "NSNotification", "NSOperation", "NSString", "NSURL"] }

[dev-dependencies]
# The crate's own fakes for its integration tests in tests/.
deino-audio = { path = ".", features = ["test-support"] }
deino-domain = { workspace = true, features = ["test-support"] }
# FND-04's fixture audio (`PcmTrack`) for the mock source round trip.
deino-testkit.workspace = true
tempfile = "3.3.0"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# getrusage for the CPU measurement in tests/kill_harness.rs.
libc = "0.2.186"

[lints]
workspace = true
