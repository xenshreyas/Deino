[package]
name = "deino-core"
version = "0.1.0"
description = "Deino's features as Tauri-free modules: models, services, ports and repositories"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/deino_core.rs"

[features]
# Fakes of this crate's ports (`FakeMeetingRepo`, ...) for other crates' tests.
# Also the sample library (`query::seed_sample_library`) over the fixtures.
test-support = [
    "deino-domain/test-support",
    "deino-secrets/test-support",
    "dep:deino-testkit",
]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
deino-db.workspace = true
deino-doc.workspace = true
deino-domain.workspace = true
# Meeting renderers behind exports, copy, email and auto-export (EXP-01/02).
deino-export.workspace = true
deino-llm.workspace = true
futures-util.workspace = true
# Company logos: the favicon fetch over the `favicons` service (ORG-04).
deino-net.workspace = true
deino-secrets.workspace = true
# The fixture meetings behind the sample library (feature `test-support`).
deino-testkit = { workspace = true, optional = true }
# RFC 7396 merge patches for settings (already in the tree through Tauri).
json-patch = { version = "3.0.1", default-features = false }
log.workspace = true
# Reasoning-envelope cleanup of model output and template title patterns
# (NOT-04 auto rules); already in the tree through the app.
regex = "1.12.3"
# Schemas for structured LLM answers (the template classifier, the
# auto-tagger) and for the read models the MCP server publishes (DEV-02);
# deino-llm's version, with chrono's date and time types.
schemars = { version = "1.2.1", features = ["chrono04"] }
serde.workspace = true
serde_json.workspace = true
# Model file verification (models/download.rs).
sha2 = "0.10.9"
specta.workspace = true
sqlx = { workspace = true, features = ["json"] }
# Jaro-Winkler for misheard names (TRN-05); already in the tree through clap.
strsim = "0.11.1"
thiserror.workspace = true
# Async file I/O, timeouts and cancellation for model downloads; the
# `TaskTracker` that owns the semantic index's background work (`rt`).
tokio.workspace = true
# Cancellation, and the tracked tasks of the account export and the
# semantic backfill (`rt`).
tokio-util.workspace = true
# The account export's zip archive (EXP-02).
zip.workspace = true
uuid.workspace = true
# Conference links in calendar events: parsing, hosts and redirect query
# parameters (already in the tree through deino-net).
url = "2.5.8"

[dev-dependencies]
deino-db = { workspace = true, features = ["test-support"] }
deino-domain = { workspace = true, features = ["test-support"] }
deino-llm = { workspace = true, features = ["test-support"] }
deino-net = { workspace = true, features = ["test-support"] }
deino-secrets = { workspace = true, features = ["test-support"] }
deino-testkit = { workspace = true, features = ["test-support"] }
# Snapshot tests of rendered prompts (profile context, template prompts).
insta = { version = "=1.43.1", features = ["json"] }
proptest = { version = "1.6", default-features = false, features = ["std"] }
tempfile = "3.3.0"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
