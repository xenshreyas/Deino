[package]
name = "deino-testkit"
version = "0.1.0"
description = "Test fixtures and fakes for Deino's crates, and the fixture seeder of the debug-only dev plugin"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/deino_testkit.rs"

[features]
# Re-exports the fakes of other crates (`test_db`, `FakeClock`). Tests enable
# it; the app's debug-only `dev` plugin does not, so release builds never
# compile fakes in.
test-support = ["deino-db/test-support", "deino-domain/test-support"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
deino-db.workspace = true
deino-doc.workspace = true
deino-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
sqlx = { workspace = true, features = ["json"] }
# Decodes the fixture audio (AAC in MP4). Already in the tree through the app.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4"] }
thiserror.workspace = true

[dev-dependencies]
deino-db = { workspace = true, features = ["test-support"] }
tokio.workspace = true

[lints]
workspace = true
