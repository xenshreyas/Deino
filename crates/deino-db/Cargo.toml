[package]
name = "deino-db"
version = "0.1.0"
description = "Deino's SQLite substrate: pools, migrations and commit-time change signals"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/deino_db.rs"

[features]
# `test_db()`: an in-memory database with every migration applied.
test-support = []

[dependencies]
async-trait.workspace = true
deino-domain.workspace = true
log.workspace = true
serde.workspace = true
specta.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
# Fills a new database key from the OS random source (already in the tree).
getrandom = "0.3.4"
# Streams rows while fingerprinting a table (already in the tree).
futures-util.workspace = true
# Fingerprints every table to verify an encryption migration (already in the tree).
sha2 = "0.10.9"
# Wipes key material from memory when it is dropped (already in the tree).
zeroize = "1.8.2"

# SQLCipher in place of plain SQLite (PRV-02, ADR 0041): the same
# libsqlite3-sys sqlx already links, built from its bundled SQLCipher
# amalgamation. Without a key it is plain SQLite, so one binary opens both.
# On Apple targets it uses CommonCrypto (Security.framework), never OpenSSL;
# on Linux it links the system libcrypto. Windows keeps plain SQLite.
[target.'cfg(unix)'.dependencies]
libsqlite3-sys = { version = "=0.30.1", default-features = false, features = ["bundled-sqlcipher"] }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3.3.0"

[lints]
workspace = true
