[package]
name = "deino-eventkit"
version = "0.1.0"
description = "macOS Calendar through EventKit: Deino's default calendar source, with no OAuth"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/deino_eventkit.rs"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
deino-core.workspace = true
deino-domain.workspace = true
log.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# EventKit itself (Zlib OR Apache-2.0 OR MIT), the objc2 release the rest of
# the workspace uses. `objc2-app-kit` gives `EKCalendar.color` as an NSColor.
objc2-event-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKObject", "EKParticipant", "EKSource", "EKTypes"] }
# The block2/objc2 set already in the tree (deino-audio, the app).
block2 = "=0.6.2"
objc2 = "=0.6.4"
# NSColor (calendar colours in sRGB) and NSWorkspace (wake notifications).
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSColor", "NSColorSpace", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSDate", "NSError", "NSNotification", "NSObject", "NSOperation", "NSPredicate", "NSSet", "NSString", "NSURL"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
