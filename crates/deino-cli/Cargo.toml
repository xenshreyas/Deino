[package]
name = "deino-cli"
version = "0.1.0"
description = "The deino command: read meetings, notes and transcripts from the terminal, and serve them to Claude over MCP (stdio)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/deino_cli.rs"

# Installed as `deino` (Settings → Developer → Install CLI). Cargo names it
# `deino-cli` because the app's own executable is already `deino`.
[[bin]]
name = "deino-cli"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
# The command line (MIT/Apache-2.0); already in the tree.
clap = { version = "4.6.1", features = ["derive", "env"] }
deino-core.workspace = true
deino-db.workspace = true
deino-domain.workspace = true
deino-export.workspace = true
# The llama-helper protocol types, for semantic search through the sidecar.
deino-llm.workspace = true
# The database key of an encrypted database, from the Keychain (PRV-02).
deino-secrets.workspace = true
# The app data dir the way Tauri resolves it (MIT/Apache-2.0); already in the tree.
dirs = "6.0.0"
# The MCP server over stdio (Apache-2.0, the official Rust SDK).
rmcp = { version = "=3.5.1", default-features = false, features = ["macros", "server", "transport-io"] }
# Tool input and output schemas; rmcp's version.
schemars = { version = "1.2.1", features = ["chrono04"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "macros", "rt-multi-thread"] }

[dev-dependencies]
# Runs the built binary in integration tests (MIT/Apache-2.0).
assert_cmd = "=2.0.17"
deino-core = { workspace = true, features = ["test-support"] }
deino-db = { workspace = true, features = ["test-support"] }
deino-secrets = { workspace = true, features = ["test-support"] }
insta = { version = "=1.43.1", features = ["json"] }
sha2 = "0.10.9"
# A plain connection to age a test database's schema.
sqlx.workspace = true
tempfile = "3.3.0"

[lints]
workspace = true
