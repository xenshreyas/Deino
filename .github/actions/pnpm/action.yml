# Installs Node and the pnpm version pinned by `packageManager` in
# frontend/package.json, with the pnpm store cached by the lockfile.
name: pnpm
description: Node 22 plus the pinned pnpm, store cached.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: frontend/package.json

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
