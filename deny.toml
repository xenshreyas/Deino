# cargo-deny: dependency licences, advisories and sources (PARITY_PLAN §3
# rule 10). `scripts/ci-local.sh deny` runs the gate CI runs.

[graph]
# Lint the dependency graph the app actually ships on its primary platform,
# plus the other desktop targets it must still compile for.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[licenses]
# Permissive licences only. MPL-2.0 is file-level copyleft: acceptable for an
# unmodified dependency, never for code copied into Deino. Anything else,
# notably GPL, AGPL and LGPL, fails the check.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# Deino's own crates are MIT (see LICENSE) and not published to crates.io.
[licenses.private]
ignore = true

[advisories]
version = 2
yanked = "warn"
# Every ignore names why it is safe for now and the card that removes it.
# Delete an entry as soon as its card lands; `cargo deny` warns about an
# ignore that no longer matches anything. CI gates on licences, bans and
# sources; advisories run as a warning there (the database changes daily).
ignore = [
    # reqwest 0.11 (the app crate and its build script) brings these in.
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3 DoS from a hostile HTTP/2 server; fixed only in h2 0.4. FND-12 moves all HTTP to deino-net on a current reqwest" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 1 is unmaintained, no vulnerability. FND-12 replaces reqwest 0.11" },
    # Upstream: no fix is possible from Deino's side until the parent updates.
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, no vulnerability; a compile-time proc macro of specta 2.0.0-rc. Revisit when the specta set is bumped" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained, no vulnerability; a compile-time proc macro of gtk-rs, only on Linux through tauri's tray. Upstream tauri" },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range is unmaintained, no vulnerability; urlpattern inside tauri-utils. Upstream tauri" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common is unmaintained, no vulnerability; urlpattern inside tauri-utils. Upstream tauri" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property is unmaintained, no vulnerability; urlpattern inside tauri-utils. Upstream tauri" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version is unmaintained, no vulnerability; urlpattern inside tauri-utils. Upstream tauri" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident is unmaintained, no vulnerability; urlpattern inside tauri-utils. Upstream tauri" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    # Unreleased cpal fixes, pinned by revision in the root Cargo.toml.
    "https://github.com/RustAudio/cpal",
    # Core Audio and ScreenCaptureKit bindings, pinned by revision.
    "https://github.com/yury/cidre",
    # Non-activating NSPanel for the meeting prompt (CAP-06), pinned by revision.
    "https://github.com/ahkohd/tauri-nspanel",
    "https://github.com/emotechlab/silero-rs",
    "https://github.com/nathanbabcock/ffmpeg-sidecar",
]
